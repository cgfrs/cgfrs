name: Update recent activity

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/recent-activity.yml"

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update recent GitHub activity
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROFILE_ACTIVITY_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const username = 'cgfrs';

            // Repositórios privados que podem alimentar o perfil.
            // O README mostra descrições públicas neutras, sem expor conteúdo privado.
            const trackedRepos = [
              { repo: 'Agente-Financeiro', label: 'Projeto de automação financeira', icon: '💰' },
              { repo: 'Agente-de-Nutri-o', label: 'Projeto de dados e automação', icon: '📊' },
              { repo: 'zerar-base-sankhya', label: 'Projeto Oracle / Sankhya', icon: '🗄️' }
            ];

            const candidates = [];
            const seen = new Set();

            const fmtDate = (value) => new Intl.DateTimeFormat('pt-BR', {
              day: '2-digit',
              month: 'short',
              timeZone: 'America/Belem'
            }).format(new Date(value)).replace('.', '');

            // Atividade pública normal do perfil.
            const { data: events } = await github.rest.activity.listPublicEventsForUser({
              username,
              per_page: 30
            });

            for (const event of events) {
              const repo = event.repo?.name;
              if (!repo) continue;

              const repoUrl = `https://github.com/${repo}`;
              const date = fmtDate(event.created_at);
              let text = '';
              const key = `public-${event.type}-${repo}`;

              switch (event.type) {
                case 'PushEvent':
                  text = `💻 **${date}** — Atualizou código em [${repo}](${repoUrl})`;
                  break;
                case 'CreateEvent':
                  if (event.payload?.ref_type === 'repository') {
                    text = `✨ **${date}** — Criou o repositório [${repo}](${repoUrl})`;
                  } else if (event.payload?.ref_type === 'branch') {
                    text = `🌿 **${date}** — Criou uma nova branch em [${repo}](${repoUrl})`;
                  }
                  break;
                case 'PullRequestEvent': {
                  const pr = event.payload?.pull_request;
                  if (pr?.html_url) text = `🔀 **${date}** — Atualizou um Pull Request em [${repo}](${pr.html_url})`;
                  break;
                }
                case 'IssuesEvent': {
                  const issue = event.payload?.issue;
                  if (issue?.html_url) text = `🧩 **${date}** — Atualizou uma issue em [${repo}](${issue.html_url})`;
                  break;
                }
                case 'ReleaseEvent':
                  text = `🚀 **${date}** — Publicou uma release em [${repo}](${repoUrl}/releases)`;
                  break;
              }

              if (text && !seen.has(key)) {
                seen.add(key);
                candidates.push({ date: new Date(event.created_at), text });
              }
            }

            // Atividade dos projetos privados autorizados.
            // Para funcionar, crie o secret PROFILE_ACTIVITY_TOKEN com um token
            // que tenha acesso somente de leitura aos repositórios privados acima.
            for (const item of trackedRepos) {
              try {
                const { data: commits } = await github.rest.repos.listCommits({
                  owner: username,
                  repo: item.repo,
                  per_page: 1
                });
                const commit = commits[0];
                const when = commit?.commit?.committer?.date || commit?.commit?.author?.date;
                if (!when) continue;

                candidates.push({
                  date: new Date(when),
                  text: `${item.icon} **${fmtDate(when)}** — Evolução em **${item.label}**`
                });
              } catch (error) {
                core.info(`Projeto ${item.repo} não acessível com o token atual; mantendo somente atividade pública.`);
              }
            }

            candidates.sort((a, b) => b.date - a.date);
            const activity = candidates.slice(0, 6).map(x => `- ${x.text}`).join('\n') ||
              '- 🔄 A atividade recente será atualizada automaticamente pelo GitHub Actions.';

            const start = '<!--START_SECTION:activity-->';
            const end = '<!--END_SECTION:activity-->';
            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');

            if (!readme.includes(start) || !readme.includes(end)) {
              core.setFailed('Marcadores da seção de atividade não encontrados no README.md');
              return;
            }

            const updated = readme.replace(
              new RegExp(`${start}[\\s\\S]*?${end}`),
              `${start}\n${activity}\n${end}`
            );

            fs.writeFileSync(readmePath, updated);

      - name: Commit updated activity
        run: |
          if git diff --quiet README.md; then
            echo "Nenhuma mudança de atividade."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update recent profile activity"
          git push
