  <rect width="420" height="180" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="418" height="178" rx="17" fill="none" stroke="#c084fc" stroke-opacity=".35"/>
  <circle cx="350" cy="34" r="8" fill="#a855f7" filter="url(#glow)">
